name: Release — wacp-console

on:
  push:
    tags: ["wacp-console-v*"]

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

# Console distribution is OCI-only (ADR-009). A single multi-platform
# image push covers all consumers; no native-archive matrix, no GH Release
# with binary artifacts. Tags ending in `-test` (e.g.,
# `wacp-console-v0.0.0-test`) exercise the OCI push path end-to-end for
# validation. Cleanup runbook: merge-plan §10.4.

jobs:
  gate:
    name: Workspace gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo check --workspace
        run: cargo check --workspace

  docker:
    name: Docker → GHCR (multi-platform)
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/wacp-console
          tags: |
            type=match,pattern=wacp-console-v(\d+\.\d+\.\d+.*),group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: wacp-console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true

  sbom:
    name: SBOM (CycloneDX) for OCI image
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/wacp-console@${{ needs.docker.outputs.digest }}
          format: cyclonedx-json
          output-file: wacp-console-${{ github.ref_name }}.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-console-${{ github.ref_name }}
          path: wacp-console-${{ github.ref_name }}.cdx.json
          if-no-files-found: error

  trivy:
    name: Trivy — scan OCI image
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trivy image scan (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/wacp-console@${{ needs.docker.outputs.digest }}
          format: sarif
          output: trivy-console.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-console-${{ github.ref_name }}
          path: trivy-console.sarif
          if-no-files-found: warn
