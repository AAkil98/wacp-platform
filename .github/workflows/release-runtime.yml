name: Release — wacp-runtime

on:
  push:
    tags: ["wacp-runtime-v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

# Tags ending in `-test` (e.g., `wacp-runtime-v0.0.0-test`) are scratch tags
# used to validate the workflow end-to-end without producing real archives
# or GitHub Releases. The native-binary build matrix and the GitHub
# Release step are skipped; only the `docker` job runs, so the full
# OIDC + ghcr.io push path is exercised in ~5 min rather than ~40 min
# (§10.4 of the merge plan). Cleanup runbook: merge-plan §10.4.

jobs:
  build:
    name: Build — ${{ matrix.target }}
    if: ${{ !endsWith(github.ref_name, '-test') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-runtime-${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p wacp-runtime --target ${{ matrix.target }}
          else
            cargo build --release -p wacp-runtime --target ${{ matrix.target }}
          fi

      - name: Strip binary (unix, native)
        if: runner.os != 'Windows' && !matrix.cross
        shell: bash
        run: strip "target/${{ matrix.target }}/release/wacp-runtime"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STEM="wacp-runtime-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "staging/$STEM"
          cp "target/${{ matrix.target }}/release/wacp-runtime" "staging/$STEM/"
          cp wacp/LICENSE wacp/NOTICE "staging/$STEM/"
          tar czf "$STEM.tar.gz" -C staging "$STEM"
          sha256sum "$STEM.tar.gz" > "$STEM.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STEM="wacp-runtime-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "staging/$STEM"
          cp "target/${{ matrix.target }}/release/wacp-runtime.exe" "staging/$STEM/"
          cp wacp/LICENSE wacp/NOTICE "staging/$STEM/"
          cd staging && 7z a "../$STEM.zip" "$STEM" && cd ..
          sha256sum "$STEM.zip" > "$STEM.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-runtime-${{ matrix.target }}
          path: wacp-runtime-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: ${{ !endsWith(github.ref_name, '-test') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "wacp-runtime ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*

  docker:
    name: Docker → GHCR
    # No -test guard here: runs on scratch tags too so the OCI push path
    # is what gets validated. See §10.4.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/wacp-runtime
          tags: |
            type=match,pattern=wacp-runtime-v(\d+\.\d+\.\d+.*),group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: wacp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
