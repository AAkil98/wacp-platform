[package]
name = "wacp-runtime"
description = "WACP — Runtime binary"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
wacp-types = { path = "../wacp-types" }
wacp-clock = { path = "../wacp-clock" }
wacp-fsm = { path = "../wacp-fsm" }
wacp-taxonomy = { path = "../wacp-taxonomy" }
wacp-trail = { path = "../wacp-trail" }
wacp-permissions = { path = "../wacp-permissions" }
wacp-workspace = { path = "../wacp-workspace" }
wacp-coordinator = { path = "../wacp-coordinator" }
wacp-transport = { path = "../wacp-transport" }
wacp-recovery = { path = "../wacp-recovery" }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
sha2 = { workspace = true }
axum = { workspace = true }

[[bin]]
name = "wacp-mock-runtime"
path = "src/bin/mock.rs"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
