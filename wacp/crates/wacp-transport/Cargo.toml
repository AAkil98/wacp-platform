[package]
name = "wacp-transport"
description = "WACP — Transport abstraction"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
wacp-proto = { workspace = true }
wacp-types = { path = "../wacp-types" }
wacp-taxonomy = { path = "../wacp-taxonomy", features = ["openapi"] }
tokio = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
prost = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { version = "5", features = ["axum_extras", "yaml"] }
futures = { workspace = true }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tokio = { workspace = true }
tower = "0.5"

[[bin]]
name = "gen_openapi"
path = "src/bin/gen_openapi.rs"
