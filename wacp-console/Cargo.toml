[workspace]
resolver = "2"
members = [
    "crates/console",
    "crates/console-api",
    "crates/console-core",
    "crates/console-db",
    "crates/console-runtime",
    "crates/console-test-support",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# gRPC / Protobuf
tonic = "0.13"
prost = "0.13"
tonic-build = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "uuid", "chrono"] }

# Concurrency
arc-swap = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }

# Cryptography
argon2 = "0.5"
sha2 = "0.10"
subtle = "2"
rand = "0.9"
base64 = "0.22"

# Filesystem
directories = "6"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras"] }

# Embedding
rust-embed = "8"

# Upstream WACP
wacp-taxonomy = { path = "../wacp/crates/wacp-taxonomy" }
wacp-types = { path = "../wacp/crates/wacp-types" }

# Internal crates
console-api = { path = "crates/console-api" }
console-core = { path = "crates/console-core" }
console-db = { path = "crates/console-db" }
console-runtime = { path = "crates/console-runtime" }
console-test-support = { path = "crates/console-test-support" }

# Test dependencies
rstest = "0.25"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

# WSL2 memory-pressure profiles (match upstream wacp)
[profile.dev]
codegen-units = 512
debug = "line-tables-only"

[profile.test]
codegen-units = 512
debug = "line-tables-only"
