[workspace]
resolver = "2"
members = [
    "wacp/crates/*",
    "wacp/tests",
    "wacp-console/crates/*",
    "wacp-console/integration",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/Madahub-dev/wacp-platform"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# gRPC / Protobuf
tonic = "0.13"
prost = "0.13"
tonic-build = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "uuid", "chrono"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Concurrency
arc-swap = "1"
parking_lot = "0.12"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
thiserror = "2"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Regex
regex = "1"

# JSON Schema
jsonschema = "0.28"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Cryptography
argon2 = "0.5"
sha2 = "0.10"
subtle = "2"
rand = "0.9"
base64 = "0.22"
ring = "0.17"

# Compression
zstd = "0.13"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
prometheus = "0.14"

# Filesystem
directories = "6"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras"] }

# Embedding
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

# Internal workspace members — consumers inherit via `{ workspace = true }`.
# Paths declared here so cargo resolves to the local member; per-crate
# Cargo.tomls reference these via `{ workspace = true }` rather than
# duplicating paths.
wacp-clock = { path = "wacp/crates/wacp-clock", version = "0.1.0" }
wacp-coordinator = { path = "wacp/crates/wacp-coordinator", version = "0.1.0" }
wacp-coordinator-sdk = { path = "wacp/crates/wacp-coordinator-sdk", version = "0.1.0" }
wacp-fsm = { path = "wacp/crates/wacp-fsm", version = "0.1.0" }
wacp-llm = { path = "wacp/crates/wacp-llm", version = "0.1.0" }
wacp-permissions = { path = "wacp/crates/wacp-permissions", version = "0.1.0" }
wacp-proto = { path = "wacp/crates/wacp-proto", version = "0.1.0" }
wacp-recovery = { path = "wacp/crates/wacp-recovery", version = "0.1.0" }
wacp-sdk = { path = "wacp/crates/wacp-sdk", version = "0.1.0" }
wacp-taxonomy = { path = "wacp/crates/wacp-taxonomy", version = "0.1.0" }
wacp-tools = { path = "wacp/crates/wacp-tools", version = "0.1.0" }
wacp-trail = { path = "wacp/crates/wacp-trail", version = "0.1.0" }
wacp-transport = { path = "wacp/crates/wacp-transport", version = "0.1.0" }
wacp-types = { path = "wacp/crates/wacp-types", version = "0.1.0" }
wacp-workspace = { path = "wacp/crates/wacp-workspace", version = "0.1.0" }
console-api = { path = "wacp-console/crates/console-api", version = "0.1.0" }
console-core = { path = "wacp-console/crates/console-core", version = "0.1.0" }
console-db = { path = "wacp-console/crates/console-db", version = "0.1.0" }
console-runtime = { path = "wacp-console/crates/console-runtime", version = "0.1.0" }
console-test-support = { path = "wacp-console/crates/console-test-support", version = "0.1.0" }

# Test dependencies
rstest = "0.25"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

# Bench harness (per v0.1.0-readiness-plan Track C → backend-perf-baseline-plan)
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
async-stream = "0.3"

# WSL2 memory-pressure profiles (mirrors both source workspaces — identical blocks).
[profile.dev]
codegen-units = 512
debug = "line-tables-only"

[profile.test]
codegen-units = 512
debug = "line-tables-only"
