# Codecov configuration for wacp-platform.
#
# Implements the audit's testing-coverage initiative (AUDIT-2026-04-15.md
# §12.7) and the v0.1.0-gate-enforcement-plan §3.2 P1.b absolute floors.
# Per-language flags carve coverage by surface so that a regression in
# one component cannot hide behind a rise in another.
#
# **Source of truth for floor numbers + ratchet schedule + handling:
# `docs/coverage-policy.md`.** Edit there first; mirror here.
#
# Gate shape (Option C from plan §5.A): per-component absolute floors PLUS
# a workspace `default: 70%` guardrail. Both must hold. Per-component
# catches narrow regressions; workspace catches the failure mode where one
# component silently slides while others mask the aggregate decline.
#
# Patch posture: new lines must be ≥ 95% covered (regression-prevention
# on incoming change, separate from the project-wide floor).
#
# End-state targets (post-v0.1.0 ratchets): Rust 95% line / 95% branch,
# Frontend 95% branch, Python 95% branch. Distance from current floors
# is intentional; ratchet schedule in docs/coverage-policy.md.

codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 4

coverage:
  precision: 2
  round: down
  range: "70...95"

  status:
    project:
      # Workspace-wide guardrail — Option C. Catches the failure mode where
      # one component is allowed to silently slide while others mask the
      # decline at the aggregate. Weighted current-state ~74%; floor 70%
      # gives a 4pt buffer.
      default:
        target: 70%
        threshold: 0.5%
        if_no_uploads: error
      # Per-component absolute floors. Baseline measurements + buffer
      # rationale in docs/coverage-policy.md. NOTE: branch coverage
      # gating is configured separately below (rust-wacp-branches etc.)
      # for components that emit branch data.
      rust-wacp:
        target: 83%
        threshold: 0.5%
        flags: [rust-wacp]
        if_no_uploads: error
      rust-console:
        target: 60%
        threshold: 0.5%
        flags: [rust-console]
        if_no_uploads: error
      frontend:
        target: 65%
        threshold: 0.5%
        flags: [frontend]
        if_no_uploads: error
      python:
        target: 78%
        threshold: 0.5%
        flags: [python]
        if_no_uploads: error
      # Branch-coverage gates: separate status entries with coverage_type:
      # branches. rust-console branch is deferred-on-tool-failure (LLVM
      # SIGSEGV under nightly+--branch on the wacp-console object set);
      # see docs/coverage-policy.md "Toolchain notes".
      rust-wacp-branches:
        target: 72%
        threshold: 0.5%
        flags: [rust-wacp]
        coverage_type: branches
      frontend-branches:
        target: 50%
        threshold: 0.5%
        flags: [frontend]
        coverage_type: branches
      python-branches:
        target: 38%
        threshold: 0.5%
        flags: [python]
        coverage_type: branches

    patch:
      default:
        target: 95%
        threshold: 0%
        if_no_uploads: error

flags:
  rust-wacp:
    paths:
      - wacp/crates/
    carryforward: true
  rust-console:
    paths:
      - wacp-console/crates/
    carryforward: true
  frontend:
    paths:
      - wacp-console/frontend/src/
    carryforward: true
  python:
    paths:
      - wacp/sdk-python/src/
    carryforward: true

comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false

ignore:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/test-setup.ts"
  - "**/api/types.ts"
  - "**/main.tsx"
  - "**/bin/gen_openapi.rs"
  - "**/bin/gen-openapi.rs"
  - "wacp-console/integration/**"
