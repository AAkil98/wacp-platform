name: CI — coverage

# Coverage pipeline (audit AUDIT-2026-04-15.md §12).
#
# Three independent jobs collect line/branch coverage per language and upload
# to Codecov with component flags. Thresholds are configured in the
# repo-root `codecov.yml`. Day-1 baseline (recorded in TASKS.md):
#   - wacp-transport (Rust):           ~88% line  /  ~83% region
#   - wacp-console frontend (TS):      ~15% line  /   ~7% branch
#   - sdk-python (Python):             unmeasured prior; this job sets the floor
#
# This pipeline runs on every push/PR alongside the normal CI workflows so
# the data is fresh for every change. Codecov status checks (set via
# `codecov.yml`) gate merges only after the project baseline has settled.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-runtime:
    name: Coverage — wacp (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nightly required for `cargo llvm-cov --branch` (passes -Z coverage-
      # options=branch under the hood; -Z requires nightly). The nightly
      # requirement is for the coverage job ONLY — production builds, ci-wacp,
      # and ci-console all stay on stable. See v0.1.0-gate-enforcement-plan
      # §3.2 P1.a + docs/coverage-policy.md for context. If nightly drift breaks
      # this job, escalation: pin to a specific nightly date.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-wacp-nightly

      # Repo .cargo/config.toml sets `-C link-arg=-fuse-ld=mold`; install
      # mold so rustc can link during coverage instrumentation.
      - uses: rui314/setup-mold@v1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        # --branch enables branch-coverage emission in the lcov output (BRF/BRH
        # lines). Required by codecov.yml's per-component branch floors —
        # see v0.1.0-gate-enforcement-plan §3.2 P1.a + §5.A.
        # RUSTUP_TOOLCHAIN=nightly overrides the workspace's rust-toolchain.toml
        # (stable) for this step only — `cargo llvm-cov --branch` passes
        # -Z coverage-options=branch which requires nightly rustc.
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cargo llvm-cov --lcov --branch --output-path lcov-wacp.info \
            -p wacp-clock -p wacp-coordinator -p wacp-coordinator-sdk \
            -p wacp-fsm -p wacp-llm -p wacp-permissions -p wacp-proto \
            -p wacp-recovery -p wacp-runtime -p wacp-sdk -p wacp-security \
            -p wacp-taxonomy -p wacp-tools -p wacp-trail -p wacp-transport \
            -p wacp-types -p wacp-workspace

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-wacp
          path: lcov-wacp.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov-wacp.info
          flags: rust-wacp
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  rust-console:
    name: Coverage — wacp-console (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nightly required for `cargo llvm-cov --branch` — see comment on the
      # rust-runtime job above.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-console-nightly

      - uses: rui314/setup-mold@v1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # rust-embed scans wacp-console/frontend/dist/ at cargo-build time;
      # build the SPA so the wacp-console binary compiles under instrumentation.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: wacp-console/frontend/pnpm-lock.yaml
      - name: Build frontend (for rust-embed)
        working-directory: wacp-console/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        # --branch + RUSTUP_TOOLCHAIN=nightly — see comment on the rust-runtime
        # job above.
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cargo llvm-cov --lcov --branch --output-path lcov-console.info \
            -p wacp-console -p console-api -p console-core \
            -p console-db -p console-runtime -p console-test-support

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-console
          path: lcov-console.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov-console.info
          flags: rust-console
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Coverage — frontend (Vitest v8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wacp-console/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: wacp-console/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run coverage
        run: pnpm test:ci

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: wacp-console/frontend/coverage/lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: wacp-console/frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend-e2e:
    name: Coverage — frontend E2E (Playwright V8)
    runs-on: ubuntu-latest
    # Mirrors `ci-console.yml::e2e` setup (Rust + pnpm + Chromium + backends),
    # but passes E2E_COVERAGE=1 so the Playwright fixture collects V8 coverage
    # per page and c8 emits an lcov with `src/**` resolved via inline sourcemaps
    # (vite.config.ts gates sourcemaps behind the same env flag).
    # Uploads under the same `frontend` Codecov flag as the Vitest job — same-
    # flag uploads for a given commit are unioned, so Playwright-covered paths
    # add to the per-file coverage instead of landing in a parallel metric.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-frontend-e2e

      - uses: rui314/setup-mold@v1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: wacp-console/frontend/pnpm-lock.yaml

      - name: Build frontend with inline sourcemaps
        working-directory: wacp-console/frontend
        env:
          E2E_COVERAGE: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build wacp-console + wacp-mock-runtime
        run: |
          cargo build \
            -p wacp-console --bin wacp-console \
            -p console-test-support --bin wacp-mock-runtime
        env:
          CARGO_BUILD_JOBS: "2"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('wacp-console/frontend/pnpm-lock.yaml') }}

      - name: Install Chromium (via Playwright)
        working-directory: wacp-console/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests with V8 coverage
        working-directory: wacp-console/frontend
        run: pnpm test:e2e:coverage

      - name: Generate lcov from raw V8 coverage
        working-directory: wacp-console/frontend
        run: pnpm coverage:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend-e2e
          path: wacp-console/frontend/coverage/e2e/lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: wacp-console/frontend/coverage/e2e/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  python:
    name: Coverage — sdk-python (branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wacp/sdk-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]" coverage[toml]

      - name: Run coverage (branch)
        run: |
          coverage run --branch --source=src -m pytest tests/
          coverage xml -o coverage.xml
          coverage report

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: wacp/sdk-python/coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: wacp/sdk-python/coverage.xml
          flags: python
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
