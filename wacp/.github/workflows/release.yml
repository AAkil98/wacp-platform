name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          # Tier 2
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --bin wacp-runtime --target ${{ matrix.target }}
          else
            cargo build --release --bin wacp-runtime --target ${{ matrix.target }}
          fi

      - name: Strip binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/wacp-runtime"
          if [ "${{ matrix.cross }}" = "true" ]; then
            # cross-compiled — may not have the right strip; skip
            true
          else
            strip "$BIN"
          fi

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STEM="wacp-runtime-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "staging/$STEM"
          cp "target/${{ matrix.target }}/release/wacp-runtime" "staging/$STEM/"
          cp LICENSE NOTICE "staging/$STEM/"
          tar czf "$STEM.tar.gz" -C staging "$STEM"
          sha256sum "$STEM.tar.gz" > "$STEM.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STEM="wacp-runtime-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "staging/$STEM"
          cp "target/${{ matrix.target }}/release/wacp-runtime.exe" "staging/$STEM/"
          cp LICENSE NOTICE "staging/$STEM/"
          cd staging && 7z a "../$STEM.zip" "$STEM" && cd ..
          sha256sum "$STEM.zip" > "$STEM.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: wacp-runtime-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "wacp-runtime ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*

  docker:
    name: Docker → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/wacp-runtime
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
