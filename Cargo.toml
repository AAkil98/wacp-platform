[workspace]
resolver = "2"
members = ["crates/*", "tests"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/Madahub-dev/wacp"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Cryptography
sha2 = "0.10"
ring = "0.17"

# Compression
zstd = "0.13"

# Encoding
base64 = "0.22"

# Synchronization
parking_lot = "0.12"

# gRPC / Protobuf
tonic = "0.13"
prost = "0.13"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Regex
regex = "1"

# JSON Schema
jsonschema = "0.28"

# Async utilities
tokio-util = "0.7"
futures = "0.3"

# Observability
tracing = "0.1"
prometheus = "0.14"
axum = { version = "0.8", features = ["ws"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }

# Identifiers
uuid = { version = "1", features = ["v4"] }

# Randomness
rand = "0.9"
