id: finance
name: Finance
defining_constraint: Regulatory pre-check + fiduciary duty — trade_execute refuses without an approved compliance_check
  checkpoint for the same trade_id (expires after 5 minutes); classifyForbiddenPattern() hard-blocks
  insider/wash/spoofing/layering/front-running/churning/painting-the-tape.
context_schema:
  compliance_scope:
    type: string
    required: true
    description: Regulatory scope for trades in this session (e.g. equities, fixed-income, derivatives).
  jurisdiction:
    type: enum
    required: true
    description: Regulatory jurisdiction governing trades in this session.
    enum_values:
      - SEC
      - FINRA
      - MiFID II
      - FCA
      - other
tool_policies:
  trade_execute:
    kind: requires_checkpoint
    description: Refuses without an approved compliance_check checkpoint whose trade_id matches and that was created within
      the last 5 minutes.
    checkpoint_type: compliance_check
    matching_field: trade_id
    expires_after_ms: 300000
checkpoint_types:
  compliance_check:
    description: Pre-trade compliance verification — regulatory check, KYC, and forbidden-pattern screen.
    fields:
      - name: trade_id
        type: string
        description: Unique identifier for the trade being checked.
      - name: instrument
        type: string
        description: Financial instrument (ticker, ISIN, CUSIP).
      - name: side
        type: enum
        description: Trade direction.
        enum_values:
          - buy
          - sell
      - name: quantity
        type: number
        description: Trade quantity.
      - name: status
        type: enum
        description: Compliance decision.
        enum_values:
          - approved
          - rejected
      - name: regulation_cited
        type: string
        description: Applicable regulation(s) checked.
      - name: forbidden_pattern_screened
        type: boolean
        description: Whether the forbidden-pattern screen ran.
      - name: suitability_verified
        type: boolean
        description: Whether suitability was verified for the client.
      - name: kyc_current
        type: boolean
        description: Whether KYC is current for the counterparty.
      - name: expires_at
        type: number
        description: Unix timestamp (ms) after which this check is stale.
quality_criteria:
  - id: regulatory_compliance
    name: Regulatory Compliance
    description: All applicable regulations cited and checked.
    weight: 1
  - id: audit_trail_integrity
    name: Audit Trail Integrity
    description: Hash chain intact, every action recorded, timestamps ordered.
    weight: 1
  - id: fiduciary_duty
    name: Fiduciary Duty
    description: Suitability verified, conflicts disclosed.
    weight: 1
  - id: risk_disclosure
    name: Risk Disclosure
    description: Material risks disclosed with specificity.
    weight: 1
  - id: data_provenance
    name: Data Provenance
    description: Sources cited, prices timestamped, model inputs versioned.
    weight: 1
  - id: documentation
    name: Documentation
    description: Methodology, assumptions, valuations documented.
    weight: 1
task_types:
  - id: finance:trade
    name: Trade Execution
    description: Execute a buy or sell order through compliance pre-check.
    workflow_id: finance:trade-execution
    keywords:
      - buy
      - sell
      - trade
      - order
      - execute
  - id: finance:rebalance
    name: Portfolio Rebalance
    description: Rebalance a portfolio to target weights.
    workflow_id: finance:portfolio-rebalance
    keywords:
      - rebalance
      - reweight
      - target weights
      - allocation
  - id: finance:onboard
    name: Client Onboarding
    description: Onboard a new client including KYC/AML screening.
    workflow_id: finance:client-onboarding
    keywords:
      - kyc
      - aml
      - onboard client
      - client onboarding
      - sanctions screen
  - id: finance:model
    name: Financial Model
    description: Build a valuation or financial model.
    workflow_id: finance:model-only
    keywords:
      - dcf
      - lbo
      - valuation
      - comparables
      - financial model
  - id: finance:risk_assess
    name: Risk Assessment
    description: Quantify portfolio or trade risk.
    workflow_id: finance:risk-only
    keywords:
      - var
      - cvar
      - value at risk
      - stress test
      - greeks
  - id: finance:compliance_check
    name: Compliance Check
    description: Run a pre-trade or regulatory compliance check.
    workflow_id: finance:compliance-only
    keywords:
      - pre-trade
      - compliance check
      - regulatory check
      - sec rule
      - finra
      - mifid
  - id: finance:audit
    name: Fiduciary Audit
    description: Audit trade history or portfolio for regulatory filings.
    workflow_id: finance:audit-only
    keywords:
      - audit trail
      - fiduciary audit
      - 10-k
      - 10-q
      - 13f
  - id: finance:analyze
    name: Investment Analysis
    description: Produce equity research, credit analysis, or macro commentary.
    workflow_id: finance:analyze-only
    keywords:
      - equity research
      - credit analysis
      - macro analysis
      - investment thesis
  - id: finance:report
    name: Performance Report
    description: Generate a quarterly, annual, or holdings report.
    workflow_id: finance:full-report
    keywords:
      - quarterly report
      - annual report
      - holdings report
      - performance report
workflows:
  - id: finance:trade-execution
    name: Trade Execution
    description: Analyze → compliance → execute → record
    stage_count: 4
    gated_stage_count: 2
  - id: finance:portfolio-rebalance
    name: Portfolio Rebalance
    description: Assess → propose → compliance → execute
    stage_count: 4
    gated_stage_count: 2
  - id: finance:full-report
    name: Full Report
    description: Collect → analyze → risk → compliance → publish
    stage_count: 5
    gated_stage_count: 2
  - id: finance:client-onboarding
    name: Client Onboarding
    description: KYC → suitability → approve
    stage_count: 3
    gated_stage_count: 3
profiles:
  - role_id: finance:analyst
    autonomy: gated
  - role_id: finance:portfolio_manager
    autonomy: gated
  - role_id: finance:risk_officer
    autonomy: gated
  - role_id: finance:compliance_officer
    autonomy: gated
  - role_id: finance:auditor
    autonomy: autonomous
tools:
  - name: market_data_fetch
    description: Fetch market data — quotes, fundamentals, historical prices, corporate actions. Auto-detects data source.
  - name: financial_model_build
    description: Build a financial model — DCF, LBO, comparables, sum-of-the-parts. Returns valuation with sensitivity analysis.
  - name: risk_calc
    description: Compute risk metrics — VaR, CVaR, beta, Greeks, scenario stress.
  - name: compliance_check
    description: Pre-trade compliance check. Classifies trade, screens against forbidden patterns, verifies suitability and
      KYC. Produces a compliance_check checkpoint that trade_execute requires.
  - name: kyc_screen
    description: KYC/AML/sanctions screen — identity, PEP, OFAC/SDN, adverse media.
  - name: trade_execute
    description: Execute a trade order. REQUIRES a prior approved compliance_check checkpoint with matching trade_id.
      Refuses execution if missing, rejected, expired, or mismatched.
  - name: portfolio_rebalance
    description: Rebalance a portfolio toward target weights. Generates a trade list — does not execute.
  - name: audit_trail_export
    description: Export the hash-chained audit trail for a workspace, with cryptographic verification.
  - name: regulatory_filing_prepare
    description: Prepare a regulatory filing — 10-K, 10-Q, 13F, ADV — from structured data.
  - name: disclosure_review
    description: Review disclosure language for material risks, conflicts of interest, required statements.
