[package]
name = "wacp-transport"
description = "WACP — Transport abstraction"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
wacp-proto = { workspace = true }
wacp-types = { workspace = true }
wacp-taxonomy = { workspace = true, features = ["openapi"] }
tokio = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
prost = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { version = "5", features = ["axum_extras", "yaml"] }
futures = { workspace = true }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
# Provides `#[mutants::skip]` for cargo-mutants triage. The crate is a
# no-op proc-macro (returns its input unchanged) — zero runtime cost,
# minimal compile cost. Required for the boundary-helper functions in
# auth.rs / auth_oauth.rs / auth_session.rs that document time-based
# survivors per AUDIT §13.7.9.
mutants = "0.0.3"

[dev-dependencies]
tokio = { workspace = true }
tower = "0.5"

[[bin]]
name = "gen_openapi"
path = "src/bin/gen_openapi.rs"
