# cargo-deny configuration for the wacp-platform workspace.
#
# Scope:
#   - advisories: hard-fail on known-vulnerable crates (RustSec DB).
#   - licenses:   allow only well-known permissive licenses; flag the rest.
#   - bans:       deny known-bad/duplicate crates; we keep this conservative
#                 so it can ratchet up over time.
#   - sources:    only crates.io is allowed; no git or non-default registries.
#
# Tuning principle: start strict on advisories, sensible on licenses, lenient
# on duplicates (multiple-versions = "warn"). Tighten as the tree stabilizes.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
exceptions = []

# Per-crate license clarifications go here when SPDX detection is ambiguous.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
# `wildcards = "warn"` (was "deny") because `allow-wildcard-paths` is not
# enough: cargo-deny v0.15+ only exempts path deps in crates explicitly
# marked `publish = false`. The workspace-internal crates (console-api,
# console-core, console-runtime, console-test-support, wacp-runtime, …)
# aren't marked that way, and tagging them requires a workspace-wide
# sweep (tracked in ci-health-2026-04-17.md §2.5 follow-up). Keeping the
# check as "warn" preserves the signal without blocking. External wildcards
# from crates.io remain flagged — cargo-deny surfaces them in the workflow
# log even at warn level.
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # serde_yaml is unmaintained; we use serde_yaml_ng (and may move to serde_yml).
    { name = "serde_yaml" },
]
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
