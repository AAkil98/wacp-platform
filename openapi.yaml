info:
  description: REST API for the WACP Console — coordination workbench for the WACP ecosystem.
  license:
    name: Apache-2.0
  title: WACP Console API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/audit-log:
    get:
      responses:
        '200':
          description: Success
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      summary: List audit log
      tags:
      - audit
  /api/auth/change-password:
    post:
      responses:
        '204':
          description: No content
        '401':
          description: Unauthenticated
      summary: Change password
      tags:
      - auth
  /api/auth/login:
    post:
      responses:
        '200':
          description: Success
      summary: Login
      tags:
      - auth
  /api/auth/logout:
    post:
      responses:
        '204':
          description: No content
        '401':
          description: Unauthenticated
      summary: Logout
      tags:
      - auth
  /api/auth/whoami:
    get:
      responses:
        '200':
          description: Success
        '401':
          description: Unauthenticated
      summary: Get current user
      tags:
      - auth
  /api/checkpoint-types:
