[project]
name = "wacp"
version = "0.1.0"
description = "WACP — Python agent SDK"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "betterproto>=1.2.5",
    "grpclib>=0.4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
