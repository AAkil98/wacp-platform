name: CI — wacp

on:
  push:
    branches: [main, dev]
    paths:
      - "wacp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-wacp.yml"
  pull_request:
    branches: [main]
    paths:
      - "wacp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-wacp.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — build, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"

      - name: Build
        run: |
          cargo build \
            -p wacp-clock -p wacp-coordinator -p wacp-coordinator-sdk \
            -p wacp-fsm -p wacp-llm -p wacp-permissions -p wacp-proto \
            -p wacp-recovery -p wacp-runtime -p wacp-sdk -p wacp-security \
            -p wacp-taxonomy -p wacp-tools -p wacp-trail -p wacp-transport \
            -p wacp-types -p wacp-workspace -p wacp-integration-tests

      - name: Clippy
        run: |
          cargo clippy \
            -p wacp-clock -p wacp-coordinator -p wacp-coordinator-sdk \
            -p wacp-fsm -p wacp-llm -p wacp-permissions -p wacp-proto \
            -p wacp-recovery -p wacp-runtime -p wacp-sdk -p wacp-security \
            -p wacp-taxonomy -p wacp-tools -p wacp-trail -p wacp-transport \
            -p wacp-types -p wacp-workspace -p wacp-integration-tests \
            -- -D warnings

      - name: Test
        run: |
          cargo test \
            -p wacp-clock -p wacp-coordinator -p wacp-coordinator-sdk \
            -p wacp-fsm -p wacp-llm -p wacp-permissions -p wacp-proto \
            -p wacp-recovery -p wacp-runtime -p wacp-sdk -p wacp-security \
            -p wacp-taxonomy -p wacp-tools -p wacp-trail -p wacp-transport \
            -p wacp-types -p wacp-workspace -p wacp-integration-tests

      - name: OpenAPI drift check
        run: |
          cargo run -p wacp-transport --bin gen_openapi > wacp/openapi.yaml.gen
          diff wacp/openapi.yaml wacp/openapi.yaml.gen \
            || (echo "wacp/openapi.yaml is stale — regenerate with: cargo run -p wacp-transport --bin gen_openapi > wacp/openapi.yaml" && exit 1)
          rm wacp/openapi.yaml.gen

  typescript-highway:
    name: TypeScript — highway-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wacp/highway-ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: wacp/highway-ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  typescript-packages:
    name: TypeScript — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - wacp/packages/wacp-local
          - wacp/packages/wacp-cli
          - wacp/ecosystem/swe
          - wacp/ecosystem/devops
          - wacp/ecosystem/mlops
          - wacp/ecosystem/finance
          - wacp/ecosystem/healthcare
          - wacp/ecosystem/analytics
          - wacp/ecosystem/datasci
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run --if-present build

  python:
    name: Python ${{ matrix.python }} — test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: wacp/sdk-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -v

  proto:
    name: Protobuf — lint, compile, codegen check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"

      - name: Compile proto files
        working-directory: wacp/proto
        run: protoc --proto_path=. primitives.proto agent.proto highway.proto taxonomy.proto coordinator.proto --descriptor_set_out=/dev/null

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify Rust codegen
        run: cargo build -p wacp-proto
